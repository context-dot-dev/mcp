name: Feature request
description: Suggest an improvement to Context MCP.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem this would help with.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the behavior you would like and any alternatives you have tried.
    validations:
      required: true
